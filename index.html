<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixelBot - Assistente Gamer</title>
    <style>
        :root {
            --primary-color: #6200ea;
            --background-color: #f5f5f7;
            --chat-bg: #ffffff;
            --text-color: #333333;
            --bot-msg-bg: #eeeeee;
            --user-msg-bg: #6200ea;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--background-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Container do Chat */
        .chat-container {
            width: 400px;
            max-width: 90%;
            height: 600px;
            background-color: var(--chat-bg);
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Cabeçalho */
        .chat-header {
            background-color: var(--primary-color);
            color: white;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 40px;
            height: 40px;
            background-color: #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
        }

        .chat-title h3 {
            margin: 0;
            font-size: 16px;
        }

        .chat-title span {
            font-size: 12px;
            opacity: 0.8;
        }

        /* Área de Mensagens */
        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.4;
        }

        .message.bot {
            background-color: var(--bot-msg-bg);
            color: var(--text-color);
            align-self: flex-start;
            border-top-left-radius: 2px;
        }

        .message.user {
            background-color: var(--user-msg-bg);
            color: white;
            align-self: flex-end;
            border-top-right-radius: 2px;
        }

        /* Área de Sugestões (Menu de Perguntas) */
        .suggestions-container {
            padding: 8px 16px;
            background-color: #fafafa;
            border-top: 1px solid #eee;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .suggestion-btn {
            background-color: white;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .suggestion-btn:hover {
            background-color: var(--primary-color);
            color: white;
        }

        /* Campo de Entrada de Texto */
        .chat-input-area {
            display: flex;
            padding: 12px;
            background-color: white;
            border-top: 1px solid #eee;
        }

        .chat-input-area input {
            flex: 1;
            border: 1px solid #ddd;
            border-radius: 24px;
            padding: 10px 16px;
            outline: none;
            font-size: 14px;
        }

        .chat-input-area button {
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            margin-left: 8px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 16px;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">
            <div class="avatar">🎮</div>
            <div class="chat-title">
                <h3>PixelBot</h3>
                <span>Online • Assistente Gamer</span>
            </div>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message bot">
                Olá, jogador! Eu sou o <strong>PixelBot</strong>, seu assistente de jogos. Escolha uma das perguntas abaixo ou digite sua dúvida! 🕹️
            </div>
        </div>

        <div class="suggestions-container">
            <button class="suggestion-btn" onclick="sendSuggestion('Me indique um jogo de RPG?')">Me indique um RPG</button>
            <button class="suggestion-btn" onclick="sendSuggestion('Qual o melhor jogo multiplayer?')">Melhor Multiplayer</button>
            <button class="suggestion-btn" onclick="sendSuggestion('Como melhorar minha mira?')">Melhorar a Mira</button>
            <button class="suggestion-btn" onclick="sendSuggestion('O que é IA nos jogos?')">IA nos jogos</button>
            <button class="suggestion-btn" onclick="sendSuggestion('Qual o jogo mais difícil?')">Jogo mais difícil</button>
        </div>

        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Digite uma mensagem..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">➤</button>
        </div>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');

        // Banco de dados de respostas (Mapeamento de perguntas básicas)
        const botResponses = {
            "rpg": "Recomendo fortemente o <strong>The Witcher 3: Wild Hunt</strong> ou o desafiador <strong>Elden Ring</strong>! Ambos têm histórias incríveis e mundos gigantescos. ⚔️",
            "multiplayer": "Se você curte tiro tático, o <strong>Valorant</strong> e o <strong>Counter-Strike 2</strong> estão em alta. Se prefere estratégia, vá de <strong>League of Legends</strong> ou <strong>Dota 2</strong>! 🎧",
            "mira": "Para melhorar sua mira, o segredo é consistência! Use softwares como o <em>Aimlabs</em> por 15 minutos antes de jogar e ajuste a sensibilidade do seu mouse para não ficar rápida demais. 🎯",
            "ia": "Nos jogos, a IA (Inteligência Artificial) controla o comportamento dos inimigos, dos companheiros de equipe e até o clima dinâmico do mapa para tornar o desafio mais realista! 🤖",
            "dificil": "A franquia <strong>Dark Souls</strong> e o jogo <strong>Sekiro: Shadows Die Twice</strong> são famosos por testarem a paciência e os reflexos de qualquer jogador experiente! 💀",
            "ola": "Olá! Tudo bem? Como posso te ajudar no mundo dos games hoje? 👾",
            "nome": "Eu sou o PixelBot, seu companheiro virtual de análises e dicas de jogos! 🤖"
        };

        // Função para adicionar mensagens na tela
        function appendMessage(text, sender) {
            const messageElement = document.createElement('div');
            messageElement.classList.add('message', sender);
            messageElement.innerHTML = text;
            chatMessages.appendChild(messageElement);
            
            // Rola a tela automaticamente para a última mensagem
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Processa a resposta do robô
        function processBotResponse(userText) {
            // Conversão para minúsculas para facilitar a busca por palavra-chave
            const text = userText.toLowerCase();
            let reply = "Desculpe, ainda estou aprendendo sobre esse assunto. Tente clicar em um dos botões de sugestão! 🎮";

            if (text.includes('rpg')) reply = botResponses.rpg;
            else if (text.includes('multiplayer') || text.includes('competitivo')) reply = botResponses.multiplayer;
            else if (text.includes('mira') || text.includes('treinar')) reply = botResponses.mira;
            else if (text.includes('ia') || text.includes('inteligencia')) reply = botResponses.ia;
            else if (text.includes('dificil') || text.includes('desafio')) reply = botResponses.dificil;
            else if (text.includes('olá') || text.includes('ola') || text.includes('oi')) reply = botResponses.ola;
            else if (text.includes('nome') || text.includes('quem é você')) reply = botResponses.nome;

            // Simula um pequeno atraso para parecer digitação humana
            setTimeout(() => {
                appendMessage(reply, 'bot');
            }, 500);
        }

        // Envia a mensagem digitada pelo usuário
        function sendMessage() {
            const text = userInput.value.trim();
            if (text === "") return;

            appendMessage(text, 'user');
            userInput.value = "";
            processBotResponse(text);
        }

        // Atalho para enviar ao apertar a tecla Enter
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        // Função ativada pelos botões de sugestão rápida
        function sendSuggestion(text) {
            appendMessage(text, 'user');
            processBotResponse(text);
        }
    </script>
</body>
</html>
